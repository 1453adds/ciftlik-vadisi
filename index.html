<style>

  for (const ob of OBST) if (!S.cleared.includes(ob.id) && ob.c === c && ob.r === r) return { ...ob, type: "obst", w: 1, h: 1 };
  for (const o of S.objs) if (o.id !== ignoreId && c >= o.c && c < o.c + o.w && r >= o.r && r < o.r + o.h) return o;
  return null;
}
function zoneAt(c, r) { return ZONES.find(z => c >= z.c0 && c <= z.c1 && r >= z.r0 && r <= z.r1) || null; }

function availableItems() {

  for (const [k, c] of Object.entries(CROPS)) if (c.lv <= L) out.push([k, 2, 6]);
  const animalLv = { yumurta: 1, sut: PENS.ahir.lv, yun: PENS.agil.lv, kecisutu: PENS.kecilik.lv, tuy: PENS.ordekhane.lv, mandasutu: PENS.mandalik.lv, kazyumurtasi: PENS.kazgolu.lv, hamsi: 3, levrek: 4 };
  for (const [k, l] of Object.entries(animalLv)) if (l <= L) out.push([k, 1, 3]);
  for (const f of Object.values(FRUITS)) if (f.lv <= L) out.push([f.urun, 2, 4]);
  for (const m of Object.values(MACHINES)) if (m.tur === "uretim" && m.lv <= L) for (const r of m.recipes) if (r.lv <= L) out.push([r.cikti, 1, 2]);
  return out;
}
function genOrder(wait) {
  const pool = availableItems(), n = 1 + Math.floor(Math.random() * Math.min(3, pool.length)), items = {};
  for (let i = 0; i < n; i++) {
    const [k, a, b] = pool[Math.floor(Math.random() * pool.length)];
    items[k] = (items[k] || 0) + a + Math.floor(Math.random() * (b - a + 1));
  }
  const value = Object.entries(items).reduce((v, [k, q]) => v + ITEMS[k].fiyat * q, 0);
  return { items, coins: Math.round(value * 1.5 + 5), xp: Math.max(2, Math.round(value / 8)), bonus: Math.random() < .35 ? MATS[Math.floor(Math.random() * 3)] : null, wait: wait || 0 };
}

function drawBoard(t) {
  const c = 8, r = 1, p = P(c + .5, r + .5);

function tapAt(sx, sy) {
  const w = toWorld(sx, sy), [c, r] = worldTile(w.x, w.y);
  if (placing) {
    const nc = c - Math.floor((placing.proto.w - 1) / 2), nr = r - Math.floor((placing.proto.h - 1) / 2);
    const same = placing.c === nc && placing.r === nr;
    placing.c = nc; placing.r = nr; showPlacingBar();
    if (same && canPlace({ ...placing.proto, c: nc, r: nr }, placing.moveId)) confirmPlace();
    return;
  }
  if (!visit) { const lz = lockedZone(c, r); if (lz) return openZone(lz); }
  if (!visit && isPond(c, r)) return openFishing();
  let hit = null;
  for (const h of hits) if (c >= h.o.c && c < h.o.c + h.o.w && r >= h.o.r && r < h.o.r + h.o.h) hit = h.o;
  if (!hit) for (let i = hits.length - 1; i >= 0; i--) {
    const h = hits[i];
    if (h.o.type === "field") { if (h.o.c === c && h.o.r === r) { hit = h.o; break; } continue; }
    if (inPoly(w, h.poly)) { hit = h.o; break; }
  }
  if (!hit) {
    if (visit) return;
    if (c >= 1 && r >= 1 && c < N - 1 && r < N - 1 && !blocked(c, r)) toast("Boş kare. Yap düğmesinden buraya tarla ya da bina kurabilirsin.");
    return;
  }
  if (visit) return tapVisit(hit);
  if (hit.type === "field") return tapField(hit);
  if (seedMode) cancelModes();
  if (hit.id && hit.type !== "obst") pop(hit.id, .5);
  if (hit.type === "decor") { sfx("tap"); return openDecor(hit); }
  if (hit.type === "pen") animalSound(PENS[hit.kind].hayvan); else if (hit.type !== "orchard") sfx("tap");
  if (hit.type === "pen") return openPen(hit);
  if (hit.type === "orchard") return tapOrchard(hit);
  if (hit.type === "machine") return openMachine(hit);
  if (hit.type === "maden") return openMine(hit);
  if (hit.type === "liman") return openPort(hit);
  if (hit.type === "garaj") return openGarage(hit);
  if (hit.type === "kuyu") return openWell(hit);
  if (hit.type === "pet") return openPet(hit);
  if (hit.type === "ziyaretci") { const v = S.ziyaret.list.find(x => x.id === hit.id); return v && openVisitor(v); }
  if (hit.type === "ambar") return openBarn("ambar");
  if (hit.type === "silo") return openBarn("silo");
  if (hit.type === "pano" || hit.type === "kamyon") return openOrders();
  if (hit.type === "evi") return openHouse();
  if (hit.type === "obst") return openObstacle(OBST.find(x => x.id === hit.id));
}

let applying = false;

    const o = S.objs.find(x => x.id === h.obj), now = Date.now();
    const dur = o && o.type === "field" && o.crop ? CROPS[o.crop].sure * 1000 : o && o.type === "orchard" ? FRUITS[o.kind].sure * 1000 : 0;
    const left = dur ? dur - (now - o.t) : 0;
    if (left > 0) { o.t -= Math.min(left, dur * .5); sped++; } else { S.coins += 5; coins += 5; }
  }

  const msg = `${who[0]}${helpers.size > 1 ? ` ve ${helpers.size - 1} kişi daha` : ""} çiftliğine yardım etti! ` + (sped ? `${sped} ekin hızlandı.` : `${coins} para bıraktı.`);

}

const TRUCK_LV = 4, TRUCK_WAIT = 180000;
let truckDrive = 0;
function genTruck() {
  const pool = availableItems().filter(([k]) => !MATS.includes(k)), items = [], used = new Set();
  while (items.length < 3 && used.size < pool.length) {
    const [k, a, b] = pool[Math.floor(Math.random() * pool.length)]; if (used.has(k)) continue; used.add(k);
    items.push({ k, n: Math.max(3, Math.round((a + b) * (2 + Math.random() * 2))), done: false });
  }
  const value = items.reduce((v, it) => v + ITEMS[it.k].fiyat * it.n, 0);
  return { items, coins: Math.round(value * 1.4 + 50), xp: Math.max(10, Math.round(value / 12)), gems: 2 + Math.floor(Math.random() * 3), next: 0 };
}
function truckPos(now) {
  if (visit || lvl().l < TRUCK_LV) return null;
  if (truckDrive) { const a = (performance.now() - truckDrive) / 4500; if (a >= 1) { truckDrive = 0; return null; } return 9.2 + a * a * 7; }
  if (!S.truck) S.truck = genTruck();
  if (S.truck.next > now) return null;
  return 9.2;
}

  box(c0, r0, 1.05, .7, 14, "#8a5a2b");
  const done = S.truck ? S.truck.items.filter(i => i.done).length : 3;

// Bereket saati: büyüyen her şey 2 kat hızlı
function berTick(dt) {

  for (const o of S.objs) {

function checkDonus() {

  const saat = Math.min(24, Math.floor(away / 3600000));

  const tar = S.objs.filter(o => o.type === "field" && o.crop && now - o.t >= CROPS[o.crop].sure * 1000).length;
  const hay = S.objs.filter(o => o.type === "pen").reduce((n, o) => n + o.animals.filter(a => animalState(o, a, now) === "ready").length, 0);

}
